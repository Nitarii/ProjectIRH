name: Stability
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.57.0
      - run: which google-chrome
      - run: node tools/localization.test.mjs
      - run: node tools/scenery.test.mjs
      - run: node tools/resource-batches.test.mjs
      - run: node tools/music.test.mjs
      - run: node tools/resource-life.test.mjs
      - run: node tools/auto-pilot.test.mjs
      - run: node tools/trails.test.mjs
      - run: node tools/navigation.test.mjs
      - run: node tools/industry.test.mjs
      - run: node tools/smoke.mjs
