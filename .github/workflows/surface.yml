name: Surface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/manual-roads.test.mjs
      - run: node tools/navigation.test.mjs
      - run: node tools/scenery.test.mjs
      - run: node tools/resource-batches.test.mjs
      - run: node tools/localization.test.mjs
